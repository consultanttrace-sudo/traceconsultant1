[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/acq-overpass"
  to = "/.netlify/functions/acq-overpass"
  status = 200
[[redirects]]
  from = "/api/acq-social-intel"
  to = "/.netlify/functions/acq-social-intel"
  status = 200
[[redirects]]
  from = "/api/acq-social-enrich"
  to = "/.netlify/functions/acq-social-enrich"
  status = 200
[[redirects]]
  from = "/api/acq-google-places"
  to = "/.netlify/functions/acq-google-places"
  status = 200
